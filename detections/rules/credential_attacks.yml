# Credential attacks against POST /login.
# One base rule (failed logins) feeds two correlation rules; a third rule flags
# the rate limiter itself firing.

title: MiniApp failed login
id: 806e5444-92a3-4745-89bb-e2d71b4ab1c8
name: miniapp_login_failed
status: experimental
description: >
  A login attempt with a wrong username or password. Not an alert on its own;
  the correlation rules below count these.
author: ecekaptan
date: 2026-11-22
tags:
  - attack.credential-access
  - attack.t1110
logsource:
  product: miniapp
  service: security
detection:
  selection:
    event: login_failed
  condition: selection
falsepositives:
  - Users mistyping their password
level: informational
---
title: Credential stuffing - one IP failing logins across many accounts
id: 1c4afe25-a625-4f65-98b4-b6e5f4e08a81
status: experimental
description: >
  One source IP fails to log in as 3 or more different accounts within 5
  minutes. Someone mistyping their own password fails against one account. A
  leaked username/password list fails against many.
author: ecekaptan
date: 2026-11-22
tags:
  - attack.credential-access
  - attack.t1110.004
correlation:
  type: value_count
  rules:
    - miniapp_login_failed
  group-by:
    - ip
  timespan: 5m
  condition:
    field: user
    gte: 3
falsepositives:
  - Many users behind one shared IP (office NAT, mobile carrier CGNAT) mistyping at the same time
level: high
---
title: Password guessing - one IP failing repeatedly against one account
id: 3d4769bc-1bf4-435c-94d7-d22049069ae5
status: experimental
description: >
  One source IP fails 5 or more times against the same account within 5
  minutes, which is a wordlist being walked against a single target.
author: ecekaptan
date: 2026-11-22
tags:
  - attack.credential-access
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - miniapp_login_failed
  group-by:
    - ip
    - user
  timespan: 5m
  condition:
    gte: 5
falsepositives:
  - A user who has forgotten their password retrying many times
level: medium
---
title: Login rate limit triggered
id: 606d438c-103c-47c0-a9ad-53725c81179e
status: experimental
description: >
  The /login rate limiter (FIX VULN 4) refused a request. The control worked,
  but something tried more than 5 logins a minute from one IP.
author: ecekaptan
date: 2026-11-22
tags:
  - attack.credential-access
  - attack.t1110
logsource:
  product: miniapp
  service: security
detection:
  selection:
    event: rate_limited
    path: /login
  condition: selection
falsepositives:
  - Misbehaving client retrying login in a loop
level: medium

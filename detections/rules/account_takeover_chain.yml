# Account takeover: a login from a country the user has never logged in from,
# then the payout IBAN is changed, then money is withdrawn, all within 15 minutes.
# Each step alone is normal (people travel, change banks, withdraw). The
# sequence in a short window is the attack.

title: MiniApp login from a new country for this user
id: 57a90a5b-3064-4f8e-a36a-a18f2da7c748
name: miniapp_login_new_country
status: experimental
description: >
  Successful login from a country not seen before for this user.
  `country_first_seen` is not written by the app. The log pipeline adds it
  (detect.py's enrich step), the same way a SIEM would with an Elastic
  "new terms" rule or a Splunk lookup of each user's known countries. A user's
  very first login sets their baseline and is never flagged.
author: ecekaptan
date: 2026-11-22
tags:
  - attack.initial-access
  - attack.t1078
logsource:
  product: miniapp
  service: security
detection:
  selection:
    event: login_success
    country_first_seen: true
  condition: selection
falsepositives:
  - Travel, VPNs
level: low
---

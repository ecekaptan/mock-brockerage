---
title: Account takeover chain - new-country login, IBAN change, withdrawal
id: a4e0e532-86ed-45ef-b6fd-79abdbd35b4f
status: experimental
description: >
  For one user, in this order within 15 minutes: a login from a new country,
  a payout IBAN change, and a withdrawal. This is the classic brokerage
  takeover: stolen credentials, redirect payouts to the attacker's account,
  drain the balance. In production this should hold the withdrawal for review,
  not only raise an alert.
author: ecekaptan
date: 2026-11-22
tags:
  - attack.initial-access
  - attack.t1078
  - attack.persistence
  - attack.t1098
  - attack.impact
  - attack.t1657
correlation:
  type: temporal_ordered
  rules:
    - miniapp_login_new_country
    - miniapp_iban_changed
    - miniapp_withdraw_sent
  group-by:
    - user
  timespan: 15m
falsepositives:
  - A customer who moved abroad, opened a local bank account and withdrew on the same day
level: critical
